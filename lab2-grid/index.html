<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монголын байгаль - зургийн цомог </title>
    <link rel="stylesheet" href="style.css">
</head> 
<body>
    <header class="site-header" id="top"><h1>Монголын байгаль</h1></header>
    <main class="gallery">
        <figure class="gallery_item gallery_item--featured">
            <img src="images/1.svg" alt="Хөвсгөл нуурын үдшийн бүрэнхий">
            <figcaption>Хөвсгөл нуур</figcaption>
        </figure>
        <figure class="gallery_item">
            <img src="images/2.svg" alt="Говийн цөлд нар жаргах үе">
            <figcaption>Говь</figcaption>
        </figure>
        <figure class="gallery_item">
            <img src="images/3.svg" alt="Хангайн нурууны">
            <figcaption>Хангай</figcaption>
        </figure>
        <figure class="gallery_item">
            <img src="images/4.svg" alt="Төв аймгийн уулсын">
            <figcaption>Төв аймаг</figcaption>
        </figure>
        <figure class="gallery_item">
            <img src="images/5.svg" alt="Алтайн нурууны">
            <figcaption>Алтай</figcaption>
        </figure>
        <figure class="gallery_item">
            <img src="images/6.svg" alt="Сэлэнгэ аймгийн">
            <figcaption>Сэлэнгэ</figcaption>
        </figure>   
    </main>
</body>
</html>
